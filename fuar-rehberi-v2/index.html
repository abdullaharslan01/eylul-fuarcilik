<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eylül Fuar Rehberi — Sunum</title>
  <meta name="description" content="Eylül Fuarcılık için Bulbi'nin hazırladığı mobil fuar rehberi konsept sunumu.">
  <link rel="icon" type="image/png" href="assets/eylul-fuarcilik-logo.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="sunum.css?v=20">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="bg" id="bg"></div>
      <div class="slides" id="slides"></div>

      <div class="topbrand"><img class="eylul" src="assets/eylul-fuarcilik-logo.png" alt="Eylül Fuarcılık"><i></i><img class="bulbi" src="assets/bulbi-logo.png" alt="Bulbi"></div>

      <button class="demo-push" id="demo-push" type="button" aria-label="Telefona örnek bildirim gönder">
        <span class="dp-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15.5 18 9M10 20.5a2.2 2.2 0 0 0 4 0"/></svg></span>
        <span class="dp-txt"><b>Bildirim gönder</b><small>Telefona örnek bildirim</small></span>
        <span class="dp-go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10.5l7 3 3 7z"/><path d="m10 13.5 4-4"/></svg></span>
      </button>

      <div class="device" id="device" aria-label="Canlı uygulama">
        <span class="btn-l1"></span><span class="btn-l2"></span><span class="btn-r"></span>
        <div class="screen">
          <iframe id="phone" title="Eylül Fuar Rehberi uygulaması" src="app/?v=20&embed=1&reset=1#/"></iframe>
          <div class="island"></div>
          <div class="home-ind"></div>
        </div>
        <div class="device-caption">Canlı uygulama · dokunabilirsiniz</div>
      </div>

      <div class="browser" id="browser" aria-label="Organizatör paneli">
        <div class="bar"><i></i><i></i><i></i><span>panel.eylulfuar · Organizatör paneli</span></div>
        <iframe id="panel" title="Eylül organizatör paneli" data-src="panel.html"></iframe>
      </div>

      <footer class="foot">
        <div class="nav">
          <button id="prev" aria-label="Önceki slayt">←</button>
          <button id="next" aria-label="Sonraki slayt">→</button>
          <span class="count" id="count">01 / 08</span>
        </div>
        <div class="dots" id="dots"></div>
      </footer>
      <div class="progress"><b id="bar"></b></div>
    </div>
  </div>

  <aside class="notes" id="notes" hidden>
    <div class="notes-head"><strong>Konuşmacı notu</strong><span id="notes-step"></span><button id="notes-close" aria-label="Kapat">×</button></div>
    <div id="notes-body"></div>
    <small>N: notları aç/kapat · F: tam ekran · ←/→: slayt</small>
  </aside>
  <button class="help-chip" id="help-chip" type="button">N · notlar</button>

  <script src="assets/qrcode.min.js"></script>
  <script src="sunum.js?v=21"></script>
</body>
</html>
